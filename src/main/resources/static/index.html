<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gemini Live Chat</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: #111827;
        --panel-2: #1f2937;
        --text: #e5e7eb;
        --muted: #9ca3af;
        --accent: #8b5cf6;
        --accent-2: #22c55e;
        --danger: #ef4444;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #020817, #111827 50%, #1f2937);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .app {
        width: min(960px, 92vw);
        height: min(88vh, 760px);
        background: rgba(17, 24, 39, 0.92);
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 18px;
        overflow: hidden;
        box-shadow: 0 20px 50px rgba(0,0,0,0.45);
      }
      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 16px 20px;
        background: rgba(19, 29, 46, 0.8);
        border-bottom: 1px solid rgba(255,255,255,0.08);
      }
      .header h1 {
        margin: 0;
        font-size: 1.25rem;
      }
      .status {
        padding: 8px 12px;
        border-radius: 999px;
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      .status.disconnected { background: rgba(148,163,184,0.2); color: var(--muted); }
      .status.connecting { background: rgba(251,191,36,0.2); color: #fbbf24; }
      .status.connected { background: rgba(34,197,94,0.2); color: #86efac; }
      .status.error { background: rgba(239,68,68,0.2); color: #fca5a5; }
      .main {
        display: flex;
        flex-direction: column;
        height: calc(100% - 74px);
      }
      .chat-box {
        flex: 1;
        overflow-y: auto;
        padding: 18px 20px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        background: rgba(15, 23, 42, 0.7);
      }
      .message {
        max-width: 75%;
        padding: 12px 14px;
        border-radius: 16px;
        line-height: 1.45;
        word-break: break-word;
      }
      .message.user {
        align-self: flex-end;
        background: rgba(139, 92, 246, 0.22);
        border-bottom-right-radius: 4px;
      }
      .message.bot {
        align-self: flex-start;
        background: rgba(31, 41, 55, 0.9);
        border-bottom-left-radius: 4px;
      }
      .controls {
        display: flex;
        gap: 10px;
        padding: 14px 16px 18px;
        border-top: 1px solid rgba(255,255,255,0.08);
        background: rgba(15, 23, 42, 0.95);
      }
      input {
        flex: 1;
        background: var(--panel-2);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 12px;
        color: var(--text);
        padding: 12px 14px;
        font-size: 1rem;
      }
      button {
        border: none;
        border-radius: 12px;
        padding: 12px 18px;
        font-weight: 700;
        cursor: pointer;
        transition: transform 0.15s ease, opacity 0.15s ease;
      }
      button:hover { transform: translateY(-1px); }
      button:disabled { opacity: 0.6; cursor: not-allowed; }
      .primary { background: var(--accent); color: white; }
      .secondary { background: #334155; color: white; }
      .danger { background: var(--danger); color: white; }
      .row { display: flex; gap: 8px; }
      .status-line {
        font-size: 0.8rem;
        color: var(--muted);
        padding: 0 20px 12px;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="header">
        <h1>Gemini Live Chat</h1>
        <div id="status" class="status disconnected">Disconnected</div>
      </div>

      <div class="main">
        <div id="chatBox" class="chat-box"></div>
        <div class="status-line" id="statusLine">Mic off • Chat ready</div>
        <div class="controls">
          <button id="connectBtn" class="primary">Connect</button>
          <button id="micBtn" class="secondary">Start Mic</button>
          <button id="sendBtn" class="secondary">Send Text</button>
          <input id="textInput" type="text" placeholder="Type a message..." />
        </div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
