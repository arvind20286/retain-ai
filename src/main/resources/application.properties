# Postgres (Supabase or local) - stores Article + ReviewCard, i.e. everything
# that used to be Notion review-state properties.
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Notion integration token + the database id from your existing schema
notion.api-token=${NOTION_API_TOKEN}
notion.datasource-id=${NOTION_DATASOURCE_ID}

# Gemini API key for question generation, grading, and the Live API session
gemini.api-key=${GEMINI_API_KEY}
gemini.model-name=${MODEL_NAME}
gemini.system-prompt=${GEMINI_SYSTEM_PROMPT}
